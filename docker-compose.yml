services:
  product-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices-network

  eureka-service:
    image: eureka-service:1.0
    restart: unless-stopped
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"
    networks:
      - microservices-network

  product-service:
    image: product-service:1.1
    restart: unless-stopped
    depends_on:
      product-db:
        condition: service_healthy
      eureka-service:
        condition: service_started
    environment:
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
    ports:
      - "${PRODUCT_HOST_PORT:-8086}:8086"
    networks:
      - microservices-network

  gateway-service:
    image: gateway-service:1.0
    restart: unless-stopped
    depends_on:
      eureka-service:
        condition: service_started
    environment:
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    networks:
      - microservices-network

volumes:
  product_db_data:

networks:
  microservices-network:
    driver: bridge
